# 发版流水线：打 tag（v*）或手动触发 → 在 GitHub macOS runner 上统一构建全部产物并发布 GitHub Release。
# 复用 scripts/build.sh（macOS universal + 单测 + Android APK + iOS 模拟器包 + dist 归集）。
# 结构：build（macos-15，无特殊权限，产物传 artifact）+ publish（ubuntu，contents:write 发 Release）。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15   # arm64；Xcode 16.x（Swift 5 语言模式向后兼容 5.6 语法，iOS 13 部署目标仍支持）
    steps:
      - uses: actions/checkout@v4

      # build.sh 内 android-build.sh 依次探测 JAVA_HOME/常见路径，setup-java 直接命中
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 项目未带 gradle wrapper，显式安装 Gradle（AGP 8.13 要求 8.13+；与本地一致用 9.5.1）
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      # runner 预装 Android SDK 但不一定有 android-35/build-tools 35，先补齐
      - name: 安装 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null

      # Android 单独跑且允许失败：step 结论可见（区分 :core 还是 :app 失败），缺 APK 不阻塞发版
      - name: Android :core 单测
        id: core
        continue-on-error: true
        run: (cd android/MacScreenClient && gradle --console=plain :core:test) 2>&1 | tail -40

      - name: Android APK
        id: app
        continue-on-error: true
        run: (cd android/MacScreenClient && gradle --console=plain :app:assembleDebug) 2>&1 | tail -60

      - name: 统一构建（macOS universal + 单测 + iOS）
        run: scripts/build.sh --skip-android

      # Release 附件只收单文件：.app/.apk 打 zip，命名带版本号（APK 构建失败时容错跳过）
      - name: 整理发版产物
        run: |
          V="${GITHUB_REF_NAME}"
          mkdir -p rel
          cd dist
          zip -ry "../rel/MacScreenAgent-${V}-macos-universal.zip" MacScreenAgent
          zip -ry "../rel/LAN-Mac-Controller-${V}-macos.app.zip" LAN-Mac-Controller.app
          zip -ry "../rel/LAN-Mac-Controller-debug-${V}-macos.app.zip" LAN-Mac-Controller-debug.app
          if [[ -f LAN-Mac-Controller-debug.apk ]]; then
            cp LAN-Mac-Controller-debug.apk "../rel/LAN-Mac-Controller-${V}-debug.apk"
          else
            echo "::warning::APK 缺失（Android :core/:app 步骤结论见 job 明细）"
          fi
          zip -ry "../rel/MacScreenClient-${V}-ios-simulator.zip" MacScreenClient.app
          cd ../rel
          ls -la
          shasum -a 256 * > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: rel/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create 需要
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: rel/

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME}"
          ls -la rel/
          # publish job 无 checkout（无 git 上下文），必须显式指定仓库
          gh release create "$V" -R "$GITHUB_REPOSITORY" --title "MacScreen $V" --generate-notes rel/*
