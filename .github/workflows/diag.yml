# 诊断用：确认仓库 Actions 基础可用性（push main 触发一次即完成使命，验证后删除）
name: Diag
on:
  push:
    branches: [main]
jobs:
  diag-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ubuntu ok $(uname -a)"
  diag-macos:
    runs-on: macos-14
    steps:
      - run: echo "macos-14 ok $(uname -a) && xcodebuild -version"
